<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ news_item.title }} | {{ homepage.site_title or shop.shop_name }}</title>
<style>
:root{--primary:{{ theme.primary or '#2563eb' }};--bg:{{ theme.background or '#f8fafc' }};--surface:{{ theme.surface or '#ffffff' }};--text:{{ theme.text or '#111827' }};--sub:{{ theme.subtext or '#6b7280' }};--font:{{ theme.font_family or "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" }};}*{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text)}a{color:inherit}.wrap{max-width:900px;margin:0 auto;padding:28px 20px 64px}.article{background:var(--surface);border:1px solid rgba(15,23,42,.08);border-radius:24px;padding:clamp(22px,4vw,44px);box-shadow:0 16px 40px rgba(15,23,42,.06)}.date{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(148,163,184,.14);color:var(--sub);font-size:13px;font-weight:800}.title{font-size:clamp(30px,5vw,48px);line-height:1.18;margin:18px 0 18px}.main-image{width:100%;max-height:520px;object-fit:cover;border-radius:20px;margin:18px 0 24px;background:#e5e7eb}.body{font-size:17px;line-height:2;white-space:pre-line}.back{display:inline-flex;margin-bottom:18px;color:var(--sub);text-decoration:none;font-weight:800}.back:hover{color:var(--primary)}
</style>
{% if homepage.custom_css %}<style>{{ homepage.custom_css|safe }}</style>{% endif %}
</head>
<body>
  <main class="wrap">
    <a class="back" href="{{ news_back_url }}#news">← お知らせ一覧へ戻る</a>
    <article class="article">
      {% if news_item.date %}<div class="date">{{ news_item.date }}</div>{% endif %}
      <h1 class="title">{{ news_item.title }}</h1>
      {% if news_image_url %}<img class="main-image" src="{{ news_image_url }}" alt="{{ news_item.title }}">{% endif %}
      <div class="body">{{ news_item.body or news_item.description or '' }}</div>
    </article>
  </main>
</body>
</html>
